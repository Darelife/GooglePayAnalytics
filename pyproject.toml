[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpay-analytics"
version = "0.1.0"
description = "Local Google Pay statement parser and expense analyzer"
requires-python = ">=3.10"
dependencies = ["pypdf>=5.0", "flask>=3.0", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gpay-analytics = "gpay_analytics:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]